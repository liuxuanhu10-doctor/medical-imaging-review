<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>医学复习助手</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>📖 医学复习助手</h1>
        <p>高效复习 · 系统掌握</p>
      </div>
      <nav class="sidebar-nav">
        <a href="#/" data-nav="home" class="active">
          <span class="icon">🏠</span> 课程列表
        </a>
      </nav>
      <div class="sidebar-footer">
        <p>医学课程知识复习</p>
        <div style="display:flex;gap:4px">
          <button class="theme-toggle" id="theme-toggle-desktop" title="切换暗色模式">🌓</button>
          <button id="ai-key-btn-desktop" style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;color:#6b5a4a;background:none;border:none" title="设置AI Key">🔑</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Home Page -->
      <div class="page active" id="page-home">
        <div class="home-header">
          <h2>我的课程</h2>
          <p>选择一门课程开始复习</p>
        </div>
        <div class="course-grid" id="course-grid">
          <div style="text-align:center;padding:40px 20px" id="loading-msg">
            <p style="font-size:2rem">📚</p>
            <p style="color:var(--text-muted);margin-top:8px">课程加载中...</p>
          </div>
        </div>
      </div>

      <!-- Course Detail Page -->
      <div class="page" id="page-course">
        <div class="course-detail-header">
          <button class="back-btn" id="btn-back-home" title="返回课程列表">←</button>
          <h2 id="course-detail-title">课程名称</h2>
          <div class="search-box" id="search-box">
            <input type="text" id="search-input" placeholder="🔍 搜索知识点..." autocomplete="off">
            <div class="search-results" id="search-results"></div>
          </div>
        </div>
        <div class="chapter-bar" id="chapter-bar"></div>
        <div class="topic-actions" id="topic-actions"></div>
        <div id="course-content"></div>
      </div>
      <!-- Back to top -->
      <button class="back-to-top" id="back-to-top" title="回到顶部">↑</button>
    </main>


    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
      <a href="#/" data-nav="home" class="active">
        <span class="icon">🏠</span>
        <span>课程</span>
      </a>
      <button class="theme-toggle" id="theme-toggle-mobile" title="切换暗色模式">🌓</button>
      <button id="ai-key-btn-mobile" style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:0.8rem;color:#6b5a4a;padding:6px 10px;border-radius:8px;transition:all 0.2s;min-width:56px;background:none;border:none;cursor:pointer"><span style="font-size:1.3rem">🔑</span><span>Key</span></button>
    </nav>
  </div>

  <!-- AI Float Button -->
  <button id="ai-float" style="position:fixed;bottom:120px;right:20px;width:52px;height:52px;border-radius:50%;background:#6366f1;color:#fff;font-size:1.4rem;border:none;cursor:pointer;z-index:99999;box-shadow:0 4px 20px rgba(99,102,241,0.5);display:flex;align-items:center;justify-content:center" title="AI助手">🤖</button>

  <!-- Pomodoro Timer Float Button -->
  <button id="pomo-float" style="position:fixed;bottom:185px;right:20px;width:52px;height:52px;border-radius:50%;background:#e85d3a;color:#fff;font-size:1.3rem;border:none;cursor:pointer;z-index:99998;box-shadow:0 4px 20px rgba(232,93,58,0.45);display:flex;align-items:center;justify-content:center" title="番茄钟">🍅</button>
  <div id="pomo-panel" style="display:none;position:fixed;bottom:190px;right:80px;width:280px;background:#fffaf3;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);z-index:99997;padding:0;overflow:hidden">
    <div style="padding:14px 18px;background:linear-gradient(135deg,#e85d3a,#f08060);color:#fff;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:0.9rem">
      <span>🍅 番茄钟</span>
      <button id="pomo-close" style="width:26px;height:26px;border-radius:50%;font-size:0.8rem;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;background:rgba(255,255,255,0.15);border:none">✕</button>
    </div>
    <div style="text-align:center;padding:20px 16px">
      <div style="font-size:3rem;font-weight:700;color:#3d2c1e;font-variant-numeric:tabular-nums;letter-spacing:2px" id="pomo-time">25:00</div>
      <div style="font-size:0.8rem;color:#9b8a7a;margin-top:4px" id="pomo-label">专注时间</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
        <button id="pomo-start" style="padding:10px 24px;border-radius:20px;background:#e85d3a;color:#fff;border:none;font-size:0.85rem;font-weight:600;cursor:pointer">开始</button>
        <button id="pomo-reset" style="padding:10px 16px;border-radius:20px;background:#fdf6ee;color:#6b5a4a;border:1px solid #e8dccf;font-size:0.85rem;cursor:pointer">重置</button>
      </div>
      <div style="display:flex;gap:4px;justify-content:center;margin-top:12px">
        <button class="pomo-preset" data-mins="25" style="padding:4px 10px;border-radius:12px;font-size:0.7rem;background:#e85d3a;color:#fff;border:none;cursor:pointer">25分</button>
        <button class="pomo-preset" data-mins="45" style="padding:4px 10px;border-radius:12px;font-size:0.7rem;background:#fdf6ee;color:#6b5a4a;border:1px solid #e8dccf;cursor:pointer">45分</button>
        <button class="pomo-preset" data-mins="15" style="padding:4px 10px;border-radius:12px;font-size:0.7rem;background:#fdf6ee;color:#6b5a4a;border:1px solid #e8dccf;cursor:pointer">15分</button>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      var grid = document.getElementById('course-grid');
      if (grid) grid.innerHTML = '<div style=\"padding:20px;color:#c46b6b;text-align:center\"><b>JS错误</b><br><small>' + msg + '<br>行: ' + line + '</small></div>';
    };
  </script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>

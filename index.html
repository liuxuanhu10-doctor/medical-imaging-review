<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>医学复习助手</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>📖 医学复习助手</h1>
        <p>高效复习 · 系统掌握</p>
      </div>
      <nav class="sidebar-nav">
        <a href="#/" data-nav="home" class="active">
          <span class="icon">🏠</span> 课程列表
        </a>
      </nav>
      <div class="sidebar-footer">
        <p>医学课程知识复习</p>
        <button class="theme-toggle" id="theme-toggle-desktop" title="切换暗色模式">🌓</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Home Page -->
      <div class="page active" id="page-home">
        <div class="home-header">
          <h2>我的课程</h2>
          <p>选择一门课程开始复习</p>
        </div>
        <div class="course-grid" id="course-grid">
          <div style="text-align:center;padding:40px 20px" id="loading-msg">
            <p style="font-size:2rem">📚</p>
            <p style="color:var(--text-muted);margin-top:8px">课程加载中...</p>
          </div>
        </div>
      </div>

      <!-- Course Detail Page -->
      <div class="page" id="page-course">
        <div class="course-detail-header">
          <button class="back-btn" id="btn-back-home" title="返回课程列表">←</button>
          <h2 id="course-detail-title">课程名称</h2>
          <div class="search-box" id="search-box">
            <input type="text" id="search-input" placeholder="🔍 搜索知识点..." autocomplete="off">
            <div class="search-results" id="search-results"></div>
          </div>
        </div>
        <div class="chapter-bar" id="chapter-bar"></div>
        <div class="topic-actions" id="topic-actions"></div>
        <div id="course-content"></div>
      </div>
      <!-- Back to top -->
      <button class="back-to-top" id="back-to-top" title="回到顶部">↑</button>

      <!-- AI Chat Panel -->
      <div class="ai-chat" id="ai-chat">
        <div class="ai-chat-header" id="ai-chat-header">
          <span>🤖 AI 学习助手</span>
          <div class="ai-chat-header-btns">
            <button class="ai-chat-mini-btn" id="ai-clear-chat" title="清空对话">🔄</button>
            <button class="ai-chat-mini-btn" id="ai-close-chat" title="最小化">—</button>
          </div>
        </div>
        <div class="ai-chat-body" id="ai-chat-body">
          <div class="ai-chat-msg ai-msg-system">你好！我是AI学习助手。选中任意知识点后点击「🤖 提问」，或直接输入问题。</div>
          <div class="ai-chat-msg ai-msg-system ai-msg-api-hint" id="ai-api-hint">首次使用请设置API Key：<a href="https://platform.deepseek.com/api_keys" target="_blank">获取DeepSeek Key</a></div>
        </div>
        <div class="ai-chat-input-row">
          <input type="password" id="ai-api-key" placeholder="输入API Key（仅存本地）" autocomplete="off">
          <input type="text" id="ai-chat-input" placeholder="输入问题..." autocomplete="off">
          <button id="ai-chat-send">发送</button>
        </div>
      </div>

      <!-- AI Floating Button -->
      <button class="ai-float-btn" id="ai-float-btn" title="AI助手">🤖</button>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
      <a href="#/" data-nav="home" class="active">
        <span class="icon">🏠</span>
        <span>课程</span>
      </a>
      <button class="theme-toggle" id="theme-toggle-mobile" title="切换暗色模式">🌓</button>
    </nav>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      var grid = document.getElementById('course-grid');
      if (grid) grid.innerHTML = '<div style=\"padding:20px;color:#c46b6b;text-align:center\"><b>JS错误</b><br><small>' + msg + '<br>行: ' + line + '</small></div>';
    };
  </script>
  <script src="js/storage.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>医学复习助手</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>📖 医学复习助手</h1>
        <p>高效复习 · 系统掌握</p>
      </div>
      <nav class="sidebar-nav">
        <a href="#/" data-nav="home" class="active">
          <span class="icon">🏠</span> 课程列表
        </a>
      </nav>
      <div class="sidebar-footer">
        <p>医学课程知识复习</p>
        <button class="theme-toggle" id="theme-toggle-desktop" title="切换暗色模式">🌓</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Home Page -->
      <div class="page active" id="page-home">
        <div class="home-header">
          <h2>我的课程</h2>
          <p>选择一门课程开始复习</p>
        </div>
        <div class="course-grid" id="course-grid">
          <div style="text-align:center;padding:40px 20px" id="loading-msg">
            <p style="font-size:2rem">📚</p>
            <p style="color:var(--text-muted);margin-top:8px">课程加载中...</p>
          </div>
        </div>
      </div>

      <!-- Course Detail Page -->
      <div class="page" id="page-course">
        <div class="course-detail-header">
          <button class="back-btn" id="btn-back-home" title="返回课程列表">←</button>
          <h2 id="course-detail-title">课程名称</h2>
          <div class="search-box" id="search-box">
            <input type="text" id="search-input" placeholder="🔍 搜索知识点..." autocomplete="off">
            <div class="search-results" id="search-results"></div>
          </div>
        </div>
        <div class="chapter-bar" id="chapter-bar"></div>
        <div class="topic-actions" id="topic-actions"></div>
        <div id="course-content"></div>
      </div>
      <!-- Back to top -->
      <button class="back-to-top" id="back-to-top" title="回到顶部">↑</button>
    </main>


    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
      <a href="#/" data-nav="home" class="active">
        <span class="icon">🏠</span>
        <span>课程</span>
      </a>
      <button class="theme-toggle" id="theme-toggle-mobile" title="切换暗色模式">🌓</button>
    </nav>
  </div>

  <!-- AI Float Test Button - inline styles, no CSS dependency -->
  <button id="ai-test-btn" style="position:fixed;bottom:120px;right:20px;width:56px;height:56px;border-radius:50%;background:#6366f1;color:#fff;font-size:1.5rem;border:none;cursor:pointer;z-index:99999;box-shadow:0 4px 20px rgba(99,102,241,0.5);display:flex;align-items:center;justify-content:center;" title="AI助手" onclick="alert('AI按钮已点击！如果看到这个弹窗，说明按钮工作了。')">🤖</button>

  <script>
    window.onerror = function(msg, url, line) {
      var grid = document.getElementById('course-grid');
      if (grid) grid.innerHTML = '<div style=\"padding:20px;color:#c46b6b;text-align:center\"><b>JS错误</b><br><small>' + msg + '<br>行: ' + line + '</small></div>';
    };
  </script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
